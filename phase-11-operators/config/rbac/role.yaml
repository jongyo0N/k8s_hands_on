# 이 ClusterRole 은 controller-gen 이 컨트롤러의 +kubebuilder:rbac 마커로부터 생성한다.
# 최소 권한 원칙: 컨트롤러가 실제로 만지는 리소스/verb 만 들어간다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: website-operator-manager-role
rules:
- apiGroups:
  - apps.example.com
  resources:
  - websites
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.example.com
  resources:
  - websites/finalizers
  verbs:
  - update
- apiGroups:
  - apps.example.com
  resources:
  - websites/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
