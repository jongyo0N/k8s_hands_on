# 리더 선출용 최소 권한(Lease/ConfigMap/Event). --leader-elect 사용 시 필요.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-operator-leader-election-role
  namespace: website-operator-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
