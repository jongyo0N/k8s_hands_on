# Lab 03 — redis StatefulSet용 headless Service
#
# clusterIP: None → "headless". 단일 VIP로 로드밸런싱하는 대신, 각 Pod에
# 안정적인 DNS 이름을 만든다:  redis-0.redis-headless.phase-02.svc.cluster.local
# StatefulSet의 spec.serviceName이 이 서비스를 가리켜야 per-Pod DNS가 생성된다.
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: phase-02
  labels:
    app: redis
spec:
  clusterIP: None
  # 기동/종료 중(NotReady)에도 DNS가 해석되도록 — StatefulSet 피어 디스커버리에 유용.
  publishNotReadyAddresses: true
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
