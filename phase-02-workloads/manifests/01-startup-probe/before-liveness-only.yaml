# Lab 01 (BEFORE) — 느리게 뜨는 앱 + startup probe 없이 liveness만 → CrashLoopBackOff 재현
#
# 시나리오: 컨테이너가 기동에 20초 걸린다(무거운 초기화·캐시 워밍 흉내).
# 흔한 실수: 기동 시간을 고려하지 않고 liveness probe를 바로 때린다.
# 결과: 서버가 뜨기 전에 liveness가 연속 실패 → kubelet이 컨테이너를 재시작 →
#       다시 20초 기동 시도 → 또 그 전에 살해 → CrashLoopBackOff(지수 백오프).
apiVersion: v1
kind: Pod
metadata:
  name: slow-start-broken
  namespace: phase-02
  labels:
    app: slow-start
    variant: broken
spec:
  # restartPolicy 기본값(Always) 유지 → 재시작이 반복되며 CrashLoopBackOff가 드러난다.
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[init] 앱 초기화 시작 — 20초간 준비 작업 흉내";
          sleep 20;
          echo "ok" > /tmp/index.html;
          echo "[ready] 8080 포트 리슨 시작";
          exec httpd -f -p 8080 -h /tmp
      ports:
        - containerPort: 8080
      # 문제의 핵심: startup probe가 없다. liveness가 기동 0초 시점부터 때린다.
      #   initialDelay 0s + period 3s + failureThreshold 3 → 약 9초에 3연속 실패 → 강제 재시작.
      #   서버는 20초에야 뜨므로, 매 재시작마다 그 전에 죽는다 → 영원히 Ready 못 됨.
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 0
        periodSeconds: 3
        failureThreshold: 3
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
