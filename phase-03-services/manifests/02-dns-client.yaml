# lab 2 — DNS 디버깅 클라이언트 (dig / nslookup / host 포함).
# dnsPolicy를 '일부러 생략' = 기본값 ClusterFirst.
#   -> kubelet이 resolv.conf에 search 도메인 + "options ndots:5"를 주입한다.
#   -> 이 ndots:5가 lab 2의 관찰 대상(짧은 이름이 search로 여러 번 번지는 현상).
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  namespace: phase-03
  labels:
    app: dnsutils
spec:
  containers:
    - name: dnsutils
      # k8s 공식 "Debugging DNS Resolution" 문서가 쓰는 e2e 테스트 이미지.
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
