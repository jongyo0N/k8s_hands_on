# Phase 5 / lab 2 — trace-pvc를 소비하는 Pod
# 이 Pod가 뜨면서 provision → (attach) → mount 단계가 이벤트/로그로 드러난다.
#   - provision: PVC events + local-path-provisioner 로그 (helper Pod가 노드에 디렉터리 생성)
#   - attach:    local-path는 CSI가 아니므로 VolumeAttachment가 "없다"(= 노드-로컬 bind mount)
#   - mount:     Pod events + 아래 volumeMounts 를 kubelet이 처리
apiVersion: v1
kind: Pod
metadata:
  name: trace-pod
  namespace: phase-05
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo hello > /data/hello.txt && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: trace-pvc
