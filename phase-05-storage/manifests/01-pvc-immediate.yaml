# Phase 5 / lab 1 — Immediate SC를 쓰는 PVC
# 관찰 포인트: 소비 Pod가 없어도 즉시 Bound 된다(= provisioner가 노드를 미리 골라버림).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-immediate
  namespace: phase-05
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: phase05-local-immediate
  resources:
    requests:
      storage: 64Mi
