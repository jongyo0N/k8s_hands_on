# Phase 9 / lab 04 — 가용성 SLO 99.9% 의 multi-window burn-rate 알림
# ==============================================================================
# SLO            : 가용성 99.9% (성공 요청 비율). 30일 기준 에러버짓 = 0.1% (= 1 - 0.999).
# 번레이트(burn) : "에러버짓을 평소보다 몇 배 속도로 태우는가". burn=1 이면 30일에 딱 소진.
# 알림 임계값     : error_ratio > burn * (1 - SLO) = burn * 0.001.
#
# 왜 multi-window(긴 창 + 짧은 창)인가?
#   - 긴 창만 쓰면: 느리게 반응하고(감지 지연), 사건이 끝나도 오래 울린다(리셋 지연).
#   - 짧은 창만 쓰면: 순간 스파이크에 민감해 거짓 알림이 많다.
#   - 둘을 AND로 묶으면: 긴 창이 "정말 버짓을 태우는 중"임을 보장하고,
#     짧은 창이 "지금도 진행 중"임을 보장한다 -> 빠른 감지 + 빠른 리셋 + 적은 소음.
#   (Google SRE Workbook "Alerting on SLOs"의 multiwindow, multi-burn-rate 패턴)
#
# 4단계 (짧은 창 = 긴 창 / 12):
#   burn 14.4 | 1h  & 5m  | 1시간에 버짓 2%  소진 | page   (즉시 호출)
#   burn 6    | 6h  & 30m | 6시간에 버짓 5%  소진 | page
#   burn 3    | 1d  & 2h  | 하루에  버짓 10% 소진 | ticket (업무시간 대응)
#   burn 1    | 3d  & 6h  | 3일에   버짓 10% 소진 | ticket
#
# ★ 이 PrometheusRule도 ServiceMonitor와 같은 선택 규칙을 탄다. Operator의 ruleSelector가
#   release 라벨로 고르므로 labels.release 를 helm 릴리스명(kube-prometheus-stack)과 맞춘다.
#
# ★ for 를 쓰지 않는다: 짧은 창(예: 5m rate)이 이미 순간 스파이크를 평활하고,
#   사건 종료 시 빠른 리셋 역할을 한다. for 를 더하면 감지만 늦어진다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-slo
  namespace: phase-09
  labels:
    app: demo-app
    release: kube-prometheus-stack   # ★ Operator의 ruleSelector가 이 라벨로 선택
spec:
  groups:
    # ---- 레코딩 룰: 창별 에러 비율을 미리 계산해 알림에서 재사용 ----
    - name: demo-app-slo.recording
      interval: 30s
      rules:
        - record: job:slo_errors:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="demo-app",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="demo-app"}[5m]))
        - record: job:slo_errors:ratio_rate30m
          expr: |
            sum(rate(http_requests_total{job="demo-app",status=~"5.."}[30m]))
            /
            sum(rate(http_requests_total{job="demo-app"}[30m]))
        - record: job:slo_errors:ratio_rate1h
          expr: |
            sum(rate(http_requests_total{job="demo-app",status=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{job="demo-app"}[1h]))
        - record: job:slo_errors:ratio_rate2h
          expr: |
            sum(rate(http_requests_total{job="demo-app",status=~"5.."}[2h]))
            /
            sum(rate(http_requests_total{job="demo-app"}[2h]))
        - record: job:slo_errors:ratio_rate6h
          expr: |
            sum(rate(http_requests_total{job="demo-app",status=~"5.."}[6h]))
            /
            sum(rate(http_requests_total{job="demo-app"}[6h]))
        - record: job:slo_errors:ratio_rate1d
          expr: |
            sum(rate(http_requests_total{job="demo-app",status=~"5.."}[1d]))
            /
            sum(rate(http_requests_total{job="demo-app"}[1d]))
        - record: job:slo_errors:ratio_rate3d
          expr: |
            sum(rate(http_requests_total{job="demo-app",status=~"5.."}[3d]))
            /
            sum(rate(http_requests_total{job="demo-app"}[3d]))

    # ---- 알림 룰: 긴 창 AND 짧은 창이 동시에 임계값을 넘을 때만 발화 ----
    # 'and on()' : 레코딩 룰 결과는 __name__만 다르므로, 빈 라벨셋으로 매칭해 AND를 성립시킨다.
    - name: demo-app-slo.alerts
      rules:
        - alert: DemoAppErrorBudgetBurnFast
          expr: |
            job:slo_errors:ratio_rate1h > (14.4 * 0.001)
            and on()
            job:slo_errors:ratio_rate5m > (14.4 * 0.001)
          labels:
            severity: page
            slo: demo-app-availability
            long_window: 1h
            short_window: 5m
          annotations:
            summary: "demo-app 에러버짓을 매우 빠르게 소진 중 (burn >= 14.4x)"
            description: "1h/5m 창 모두 임계값(1.44%)을 초과. 이 속도면 30일 버짓의 2%를 약 1시간에 태운다. 현재 1h 에러율={{ $value | humanizePercentage }}."
        - alert: DemoAppErrorBudgetBurnMedium
          expr: |
            job:slo_errors:ratio_rate6h > (6 * 0.001)
            and on()
            job:slo_errors:ratio_rate30m > (6 * 0.001)
          labels:
            severity: page
            slo: demo-app-availability
            long_window: 6h
            short_window: 30m
          annotations:
            summary: "demo-app 에러버짓을 빠르게 소진 중 (burn >= 6x)"
            description: "6h/30m 창 모두 임계값(0.6%)을 초과. 6시간에 버짓의 5%를 태우는 속도. 현재 6h 에러율={{ $value | humanizePercentage }}."
        - alert: DemoAppErrorBudgetBurnSlow
          expr: |
            job:slo_errors:ratio_rate1d > (3 * 0.001)
            and on()
            job:slo_errors:ratio_rate2h > (3 * 0.001)
          labels:
            severity: ticket
            slo: demo-app-availability
            long_window: 1d
            short_window: 2h
          annotations:
            summary: "demo-app 에러버짓 소진 추세 (burn >= 3x)"
            description: "1d/2h 창 모두 임계값(0.3%)을 초과. 하루에 버짓의 10%를 태우는 속도. 현재 1d 에러율={{ $value | humanizePercentage }}."
        - alert: DemoAppErrorBudgetBurnVerySlow
          expr: |
            job:slo_errors:ratio_rate3d > (1 * 0.001)
            and on()
            job:slo_errors:ratio_rate6h > (1 * 0.001)
          labels:
            severity: ticket
            slo: demo-app-availability
            long_window: 3d
            short_window: 6h
          annotations:
            summary: "demo-app 에러버짓 완만한 소진 (burn >= 1x)"
            description: "3d/6h 창 모두 임계값(0.1%)을 초과. 현 추세가 유지되면 30일 버짓을 모두 소진한다. 현재 3d 에러율={{ $value | humanizePercentage }}."
