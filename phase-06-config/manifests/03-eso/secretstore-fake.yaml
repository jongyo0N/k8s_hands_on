# Phase 6 / lab 3 — External Secrets Operator: fake provider SecretStore.
# fake provider는 '외부 저장소 흉내' (정적 key/value). Vault 같은 외부 시스템 없이 ESO 흐름을 체험하기 위함.
#   - 실제 환경에선 이 자리에 vault / aws / gcp / azure / kubernetes 등 provider가 들어간다.
#   - 회전(rotation) 실습: 아래 data의 value를 바꿔 다시 apply하면, ExternalSecret이
#     refreshInterval 주기로 다시 읽어와 대상 Secret을 갱신한다(= 외부 저장소가 '진실의 원천').
#
# apiVersion 주의: ESO v2.x(chart 2.x)는 external-secrets.io/v1 만 기본 제공한다.
#   (v1beta1은 crds.unsafeServeV1Beta1 를 켜야만 served — 신규 매니페스트는 v1 사용)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fake-store
  namespace: phase-06
spec:
  provider:
    fake:
      data:
        - key: "/demo/db/password"
          value: "s3cr3t-from-fake-provider-v1"
          version: "v1"
        - key: "/demo/api/token"
          value: "tok_fake_v1"
          version: "v1"
