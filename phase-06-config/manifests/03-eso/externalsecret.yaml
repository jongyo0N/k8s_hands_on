# Phase 6 / lab 3 — ExternalSecret: 외부(fake) 저장소의 값을 k8s Secret으로 '동기화'한다.
# 흐름: ExternalSecret(의도) → ESO 컨트롤러가 SecretStore로 조회 → target.name 의 Secret 생성/갱신.
#   - creationPolicy: Owner → ESO가 대상 Secret의 소유자(없으면 만들고, ExternalSecret 삭제 시 함께 정리).
#   - refreshInterval → 이 주기마다 provider를 다시 읽어 변경을 반영(= 회전 전파 경로).
#     실습용으로 짧게(15s) 뒀다. 실무는 provider 부하/비용을 보고 1h 등으로 조절.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-externalsecret
  namespace: phase-06
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: fake-store
    kind: SecretStore
  target:
    name: demo-synced-secret   # ESO가 만들어줄 k8s Secret 이름
    creationPolicy: Owner
  data:
    - secretKey: db-password    # 생성될 Secret의 key
      remoteRef:
        key: "/demo/db/password"  # provider 상의 경로
    - secretKey: api-token
      remoteRef:
        key: "/demo/api/token"
