# Phase 6 / lab 2 — encryption at rest 대안: secretbox provider.
# secretbox = XSalsa20-Poly1305 기반 AEAD(기밀성 + 무결성). aescbc보다 권장되는 로컬/자체관리 선택.
# 사용법은 aescbc 버전과 동일 — 02b 스크립트에서 PROVIDER=secretbox 로 선택할 수 있다.
#
# 여전히 '키가 노드/설정 파일에 평문으로 존재'하는 한계는 남는다(DEK=KEK 분리가 없음).
# 진짜 프로덕션은 KMS v2 provider로 KEK를 외부 KMS에 두는 구조를 쓴다.
#
# secret 키: head -c 32 /dev/urandom | base64  (실제 키는 노드에만, git 금지. 아래는 placeholder)
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
    providers:
      - secretbox:
          keys:
            - name: key1
              secret: REPLACE_WITH_BASE64_32BYTE_KEY
      - identity: {}
