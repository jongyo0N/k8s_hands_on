# Phase 6 / lab 2 — "Secret은 평문이다" 데모용 Secret.
# stringData 에 사람이 읽는 평문을 넣으면 API가 저장 시 base64로 인코딩한다.
# 핵심: base64는 '인코딩'이지 '암호화'가 아니다.
#   - kubectl get secret -o yaml 로 보이는 값은 base64일 뿐 → base64 -d 면 바로 평문.
#   - encryption at rest를 끄면 etcd에도 '평문'으로 들어간다(02 스크립트로 직접 확인).
apiVersion: v1
kind: Secret
metadata:
  name: demo-plain
  namespace: phase-06
type: Opaque
stringData:
  db-password: "super-secret-password-123"
  api-token: "tok_live_do_not_log_me"
