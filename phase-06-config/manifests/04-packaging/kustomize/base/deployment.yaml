apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myapp
    spec:
      containers:
        - name: myapp
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          # envFrom 이 참조하는 ConfigMap 이름은 overlay의 namePrefix로 바뀌어도
          # Kustomize의 nameReference 트랜스포머가 자동으로 따라 고쳐준다(dev-myapp-config 등).
          envFrom:
            - configMapRef:
                name: myapp-config
