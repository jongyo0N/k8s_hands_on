# Phase 12 / lab 3 — Rollout 앞단 Service.
# Rollout이 관리하는 Pod(app=web-rollout)를 가리킨다.
# (트래픽 라우터를 안 쓰므로 단일 Service가 stable+canary Pod로 함께 로드밸런싱된다.)
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: phase-12
  labels:
    app: web-rollout
spec:
  selector:
    app: web-rollout
  ports:
    - name: http
      port: 80
      targetPort: 80
