# API ServiceMonitor (Phase 9 — Prometheus Operator CRD).
# 전제: kube-prometheus-stack 등 Prometheus Operator와 그 CRD가 설치되어 있어야 한다.
#   - release 라벨: kube-prometheus-stack의 Prometheus가 serviceMonitorSelector로
#     고르는 기본 라벨. 설치 시 지정한 release 이름과 맞춰야 scrape된다.
#   - endpoints.port: Service의 'metrics' 포트(named)를 참조.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capstone-api
  labels:
    app.kubernetes.io/name: capstone-api
    app.kubernetes.io/part-of: capstone
    app.kubernetes.io/component: api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone-api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
