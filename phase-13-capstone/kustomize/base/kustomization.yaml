# Phase 13 캡스톤 — base (Phase 6 Kustomize base/overlay 패턴).
# base는 환경 중립적인 통합 앱의 '뼈대'. 환경별 차이는 overlays/{dev,prod}에서 얹는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 모든 네임스페이스 리소스를 capstone으로 강제(Namespace 오브젝트는 클러스터 스코프라 제외됨).
namespace: capstone

resources:
  - namespace.yaml
  - api-configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - api-servicemonitor.yaml
  - store-statefulset.yaml
  - store-service.yaml
  - store-pdb.yaml
  - gateway.yaml
  - httproute.yaml
  - networkpolicy.yaml
