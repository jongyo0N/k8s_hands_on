# API 수평 오토스케일링 (Phase 7).
# 전제: metrics-server가 설치되어 있어야 Resource 메트릭(CPU/memory)을 읽는다.
# behavior로 플래핑을 억제한다 — 빠르게 올리고(scaleUp 즉시) 천천히 내린다(scaleDown 5분 안정화).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capstone-api
  labels:
    app.kubernetes.io/name: capstone-api
    app.kubernetes.io/part-of: capstone
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capstone-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0      # 스파이크엔 즉시 반응.
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 4, periodSeconds: 30 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300    # 5분간 최대치를 보고 천천히 축소 → 플래핑 방지.
      policies:
        - { type: Percent, value: 50, periodSeconds: 60 }
