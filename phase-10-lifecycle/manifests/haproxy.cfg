# Phase 10 / lab 01 — HAProxy 설정 (control-plane 로드밸런서, LB 노드 10.0.0.10)
# ---------------------------------------------------------------------------
# 주의: 이 파일은 YAML 이 아니라 HAProxy 설정이다. LB VM 의 /etc/haproxy/haproxy.cfg 로 복사한다.
#       (그래서 phase-10 의 YAML 파싱 검증 대상에서는 제외된다.)
# 모드: TCP 패스스루 — LB 가 TLS 를 종단하지 않고 그대로 apiserver 로 넘긴다.
#       (apiserver 가 클라이언트 인증서 mTLS 를 직접 처리해야 하므로 L7 종단을 하면 안 된다.)
# ---------------------------------------------------------------------------
global
    log /dev/log local0
    maxconn 4000
    daemon

defaults
    mode                tcp
    log                 global
    option              tcplog
    option              dontlognull
    timeout connect     10s
    timeout client      30s
    timeout server      30s
    retries             3

# 상태 페이지(선택) — 어느 control-plane 이 UP/DOWN 인지 눈으로 확인. http://10.0.0.10:8404/stats
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s

frontend kube-apiserver
    bind *:6443
    mode tcp
    option tcplog
    default_backend kube-apiserver

backend kube-apiserver
    mode tcp
    option tcp-check
    balance roundrobin
    # 3개 control-plane 의 apiserver(:6443). check 로 죽은 노드는 백엔드에서 자동 제외된다 → 이것이 HA.
    #   cp 한 대가 죽어도 LB 가 살아있는 2대로만 트래픽을 보낸다 (etcd 쿼럼 2/3 도 유지되는 한).
    server cp1 10.0.0.11:6443 check
    server cp2 10.0.0.12:6443 check
    server cp3 10.0.0.13:6443 check

# 참고: LB 자체도 단일 장애점(SPOF)이다. 운영에서는 HAProxy 2대 + keepalived(VRRP)로
#       가상 IP(VIP)를 띄워 LB 도 이중화한다. 이 랩에서는 단일 LB 로 개념만 잡는다.
