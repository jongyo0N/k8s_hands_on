# Phase 4 / lab 3 — 수정: DNS egress 허용 (이름 해석 복구)
# netpol-demo의 모든 Pod가 kube-system의 kube-dns(CoreDNS)로 UDP/TCP 53을 쓸 수 있게 연다.
#   - namespaceSelector: kube-system (자동 라벨 kubernetes.io/metadata.name 사용)
#   - podSelector: k8s-app=kube-dns (CoreDNS Pod 라벨)
#   - UDP 53 + TCP 53 둘 다 (큰 응답/truncate 시 TCP로 폴백 → TCP도 꼭 함께)
# 적용 후: nslookup/curl 이 '이름'으로도 성공한다.
#
# 운영 팁: 이 "DNS 허용" 규칙은 거의 모든 네임스페이스의 default-deny에 세트로 들어간다.
#          그래서 보통 별도 공통 정책으로 떼어 관리한다 (여기처럼 podSelector: {}).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: netpol-demo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
