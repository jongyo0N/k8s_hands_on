# Phase 4 / lab 2 — 경로 기반 라우팅 (HTTPRoute, 앱 팀 소관)
#   /v1* → echo-v1,  /v2* → echo-v2
# 검증: curl http://<gw>/v1  → "echo v1"
#       curl http://<gw>/v2  → "echo v2"
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-path
  namespace: gw-demo
spec:
  parentRefs:
    - name: web-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: echo-v1
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /v2
      backendRefs:
        - name: echo-v2
          port: 80
