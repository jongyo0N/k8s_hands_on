# Phase 4 / lab 2 — (선택) Cilium LB-IPAM IP 풀
#
# Cilium Gateway는 기본적으로 LoadBalancer 타입 Service를 만든다. kind에는 클라우드
# LB가 없어 EXTERNAL-IP가 <pending>으로 남는다. 02 스크립트의 기본 검증은
# 'port-forward'라 이 풀 없이도 동작하지만, EXTERNAL-IP를 '진짜로' 받고 싶다면 적용한다.
#
# 주의: cidr는 kind 도커 네트워크('kind', 보통 172.18.0.0/16) 안의 '미사용' 대역이어야 한다.
#   확인:  docker network inspect kind -f '{{(index .IPAM.Config 0).Subnet}}'
#   아래 값은 그 가정하의 예시다 — 환경에 맞게 바꾼다.
# 또한 kind 네트워크 IP는 호스트(macOS)에서 직접 라우팅되지 않을 수 있다
# (그 경우 노드 컨테이너 안에서 curl 하거나, 역시 port-forward를 쓴다).
# Ref: https://docs.cilium.io/en/stable/network/lb-ipam/
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: gw-pool
spec:
  blocks:
    - cidr: "172.18.255.0/24"
