# Phase 1 / lab 3 — scheduler를 "건너뛰는" Pod.
#
# spec.nodeName 을 직접 박아두면 binding이 이미 끝난 셈이다 → scheduler가 없어도
# 해당 노드의 kubelet이 자기 노드에 배정된 Pod를 보고 곧바로 띄운다.
# "scheduler = (적합한 노드를 골라) nodeName을 채워주는 자"라는 역할 경계를 증명한다.
#
# nodeName은 kind 클러스터 'k8s-mastery'의 첫 워커 컨테이너 이름으로 고정했다.
# (노드 이름: k8s-mastery-control-plane / -worker / -worker2 / -worker3)
apiVersion: v1
kind: Pod
metadata:
  name: sched-pinned
  labels:
    phase: "1"
    lab: scheduler
spec:
  nodeName: k8s-mastery-worker
  containers:
    - name: app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
