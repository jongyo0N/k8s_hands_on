# Phase 1 / lab 3 — scheduler가 노드를 "할당(binding)"해줘야만 뜨는 평범한 Pod.
#
# spec.nodeName 이 비어 있다 → kube-scheduler가 노드를 골라 nodeName을 채워줄
# 때까지 이 Pod는 Pending에 머문다.
# lab 3에서 scheduler를 멈춘 상태로 이 Pod를 만들면, 아무도 nodeName을 채워주지
# 않으므로 계속 Pending 이다. (scheduler가 하는 일의 경계를 증명)
apiVersion: v1
kind: Pod
metadata:
  name: sched-pending
  labels:
    phase: "1"
    lab: scheduler
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
