# Phase 7 / lab 2 — QoS 클래스 3종
#
# kubelet이 Pod의 requests/limits "형태"만 보고 자동으로 QoS 클래스를 매긴다
# (spec에 직접 쓰는 필드가 아님 → status.qosClass 로 확인).
#
#   Guaranteed : 모든 컨테이너가 cpu/memory 둘 다 requests==limits.
#   Burstable  : 하나라도 requests가 있지만 Guaranteed 조건은 아님.
#   BestEffort : requests/limits 가 아예 없음.
#
# 왜 중요한가 — 노드 메모리 압박 시 eviction(축출) 우선순위:
#   BestEffort 먼저 → Burstable(requests 초과분이 큰 순) → Guaranteed 마지막.
#   즉 아무것도 선언 안 한 Pod가 가장 먼저 죽는다. "선언이 곧 보호."
#   (OOM score 조정에도 반영: BestEffort의 oom_score_adj가 가장 높다 = 먼저 죽음.)
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  namespace: phase-07
  labels: { app: qos-demo, qos: guaranteed }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      resources:
        # requests == limits (cpu, memory 모두) → Guaranteed
        requests: { cpu: "100m", memory: "64Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
  namespace: phase-07
  labels: { app: qos-demo, qos: burstable }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      resources:
        # requests < limits → Burstable
        requests: { cpu: "50m", memory: "32Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  namespace: phase-07
  labels: { app: qos-demo, qos: besteffort }
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      # resources 를 아예 선언하지 않음 → BestEffort (가장 먼저 축출됨)
