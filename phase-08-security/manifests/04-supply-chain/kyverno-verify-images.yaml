# Phase 8 / lab 4 — Kyverno로 '미서명 이미지 배포 차단'
#
# 왜 VAP가 아니라 Kyverno인가:
#   서명 검증은 레지스트리에서 서명 아티팩트를 가져와 공개키로 '암호 검증'하고
#   (선택적으로) Rekor 투명성 로그를 조회하는 작업이다. CEL/VAP는 이런 외부 I/O·
#   암호 연산을 못 한다. 그래서 서명 게이트는 Kyverno(verifyImages) 또는 sigstore
#   policy-controller 같은 '엔진'이 필요하다. (출처/태그 같은 '구조' 규칙은 lab 3의 VAP로.)
#
# 버전 핀: Kyverno v1.16.x 기준 스키마 (per-rule failureAction, keys.rekor.ignoreTlog 등).
#   최신/호환 확인: https://kyverno.io/docs/installation/ (k8s 버전 호환 매트릭스)
#                   https://github.com/kyverno/kyverno/releases
#   참고: v1.10 이전에는 spec.validationFailureAction(전역), 'audit/enforce'(소문자)였다.
#         현재는 rule별 failureAction: Enforce|Audit (대문자)를 쓴다.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: phase08-verify-image-signatures
spec:
  # Pod 생성 시점에만 검증(백그라운드 스캔 불필요). 서명 검증은 webhook timeout에 민감.
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-signed-by-org-key
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["phase-08"]
      verifyImages:
        - imageReferences:
            - "ghcr.io/jongyo0N/*"       # 이 prefix 이미지는 '반드시' 서명되어 있어야 함
          # 단계적 도입: 처음엔 Audit로 관찰 → Enforce로 승격(차단).
          failureAction: Enforce
          required: true                  # 서명이 '없으면' 실패(기본 정책)
          mutateDigest: true              # 검증 통과 시 태그→다이제스트로 치환(TOCTOU 방지, 불변 고정)
          verifyDigest: true
          attestors:
            - count: 1                    # 아래 entries 중 최소 1개로 검증되면 통과
              entries:
                - keys:
                    # cosign 공개키. 04-supply-chain-gate.sh가 만든 cosign.pub 내용으로 교체.
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      # ↓↓↓ 자리표시자. 실제 cosign.pub(ECDSA P-256)로 교체할 것 ↓↓↓
                      REPLACE_WITH_COSIGN_PUBLIC_KEY_PEM_BASE64_BODY
                      -----END PUBLIC KEY-----
                    # 오프라인/키기반 검증: 투명성 로그·인증서 투명성(SCT) 조회를 생략.
                    # (키리스/OIDC 서명을 쓰면 아래를 지우고 keyless + rekor.url 로 전환)
                    rekor:
                      ignoreTlog: true
                    ctlog:
                      ignoreSCT: true
