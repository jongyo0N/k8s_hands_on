# Phase 8 / lab 2 — 애플리케이션용 ServiceAccount
#
# 워크로드는 default SA를 쓰지 말고 '전용 SA + 최소 권한'을 할당하는 것이 원칙이다.
# default SA는 네임스페이스마다 자동 생성돼 여러 Pod가 공유 → 권한 추적·회수가 어렵다.
#
# automountServiceAccountToken: false 로 두면, 이 SA를 쓰는 Pod라도 토큰이 자동으로
# 마운트되지 않는다. API 서버와 통신할 필요가 '없는' 워크로드라면 토큰 자체를 주지 않는
# 것이 가장 강한 최소 권한이다. (아래 appsa는 API를 쓰는 전제라 true로 둔다.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: appsa
  namespace: phase-08
automountServiceAccountToken: true
